<!-- Supabase Dashboard > Authentication > Emails > Templates > "Reset password"
     Subject: كود إعادة تعيين كلمة المرور | Your password reset code -->
<div dir="rtl" style="font-family:Tahoma,Arial,sans-serif;background:#0B1220;padding:32px;color:#E5E7EB">
  <div style="max-width:480px;margin:auto;background:#111A2E;border:1px solid #1f2a44;border-radius:20px;padding:28px;text-align:center">
    <h2 style="margin:0 0 8px;color:#12B886">أكاديمية النخبة ⚽</h2>
    <p style="margin:0 0 20px;color:#9CA3AF">اكتب الكود ده في التطبيق لتعيين كلمة مرور جديدة</p>
    <div style="font-size:34px;letter-spacing:10px;font-weight:800;background:#0B1220;border:1px dashed #12B886;border-radius:14px;padding:16px 0;color:#fff">{{ .Token }}</div>
    <p style="margin:20px 0 0;color:#9CA3AF;font-size:12px">الكود صالح لمدة محدودة. لو مطلبتش تغيير كلمة المرور تجاهل الرسالة.</p>
    <hr style="border:none;border-top:1px solid #1f2a44;margin:20px 0">
    <div dir="ltr" style="color:#9CA3AF;font-size:12px">Enter this code in the app to set a new password. If you did not request it, ignore this message.</div>
  </div>
</div>
